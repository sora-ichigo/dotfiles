config-version = 2

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

exec-on-workspace-change = ['/bin/bash', '-c', '$HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']
on-focus-changed = ['exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']

[[on-window-detected]]
    if.app-id = 'com.electron.aqua-voice'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.github.wez.wezterm'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = ['move-node-to-workspace 4', 'exec-and-forget $HOME/.config/aerospace/place_slack.sh']

[workspace-to-monitor-force-assignment]
    2 = 'secondary'
    4 = 'secondary'

[gaps]
    inner.horizontal = 6
    inner.vertical =   6
    outer.left =       68
    outer.bottom =     12
    outer.top =        12
    outer.right =      12

[mode.main.binding]
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    alt-f = 'fullscreen'
    alt-t = 'layout floating tiling'

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-6 = ['move-node-to-workspace 6', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-7 = ['move-node-to-workspace 7', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-8 = ['move-node-to-workspace 8', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']
    alt-shift-9 = ['move-node-to-workspace 9', 'exec-and-forget $HOME/.nix-profile/bin/sketchybar --trigger aerospace_workspace_change']

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-shift-a = 'exec-and-forget $HOME/.config/aerospace/arrange.sh'

    alt-shift-semicolon = 'mode service'
    alt-c = ['exec-and-forget sketchybar --set claude popup.drawing=on --trigger claude_agents_update', 'mode claude']

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']
    f = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

[mode.claude.binding]
    esc = ['exec-and-forget sketchybar --set claude popup.drawing=off', 'mode main']
    alt-c = ['exec-and-forget sketchybar --set claude popup.drawing=off', 'mode main']
    1 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 1', 'mode main']
    2 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 2', 'mode main']
    3 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 3', 'mode main']
    4 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 4', 'mode main']
    5 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 5', 'mode main']
    6 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 6', 'mode main']
    7 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 7', 'mode main']
    8 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 8', 'mode main']
    9 = ['exec-and-forget $HOME/.config/sketchybar/plugins/claude_select.sh 9', 'mode main']

[exec]
    inherit-env-vars = true

[exec.env-vars]
    PATH = '${HOME}/.local/bin:${HOME}/.nix-profile/bin:/opt/homebrew/bin:${PATH}'
